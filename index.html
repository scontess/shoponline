<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloceStore - Modern Serverless E-Commerce</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col justify-between" x-data="storeApp()">

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" @click="view = 'shop'">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span class="text-xl font-bold tracking-tight text-gray-900">VeloceStore</span>
      </div>

      <!-- Navigation & Cart Button -->
      <div class="flex items-center space-x-6">
        <button @click="view = 'shop'" class="text-sm font-medium text-gray-700 hover:text-indigo-600 transition">Shop</button>
        <button @click="view = 'cart'" class="relative bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full font-medium flex items-center space-x-2 hover:bg-indigo-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          <span>Cart</span>
          <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full" x-text="cartCount"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- ERROR BANNER -->
    <template x-if="errorMessage">
      <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 text-red-700 rounded shadow-sm flex justify-between items-center">
        <p x-text="errorMessage"></p>
        <button @click="errorMessage = ''" class="text-red-500 font-bold">&times;</button>
      </div>
    </template>

    <!-- LOADING SPINNER -->
    <template x-if="loading && products.length === 0">
      <div class="flex justify-center items-center py-32">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
      </div>
    </template>

    <!-- VIEW 1: SHOP CATALOGUE -->
    <div x-show="view === 'shop'" class="space-y-8">
      <!-- Search and Filter Bar -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <!-- Categories -->
        <div class="flex flex-wrap gap-2">
          <template x-for="cat in categories" :key="cat">
            <button @click="selectedCategory = cat" 
                    :class="selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition"
                    x-text="cat">
            </button>
          </template>
        </div>
        <!-- Search -->
        <div>
          <input type="text" x-model="searchQuery" placeholder="Search products..." 
                 class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>

      <!-- Products Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="product in filteredProducts" :key="product.id">
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="h-48 w-full bg-gray-200 overflow-hidden relative">
                <!-- CORRETTO: image_url anziché image -->
                <img :src="product.image_url" :alt="product.name" class="w-full h-full object-cover">
                <span class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm text-xs font-semibold px-2.5 py-1 rounded-full text-indigo-700" x-text="product.category || 'Generale'"></span>
              </div>
              <div class="p-5">
                <!-- CORRETTO: name anziché title -->
                <h3 class="font-semibold text-lg text-gray-900 mb-1" x-text="product.name"></h3>
                <!-- CORRETTO: short_description anziché description -->
                <p class="text-gray-500 text-sm line-clamp-2 mb-4" x-text="product.short_description"></p>
                <!-- CORRETTO: unit_price anziché price -->
                <div class="text-xl font-bold text-indigo-600" x-text="'$' + Number(product.unit_price).toFixed(2)"></div>
              </div>
            </div>
            <div class="p-5 pt-0">
              <button @click="addToCart(product)" 
                      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium text-sm transition shadow-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Add to Cart</span>
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Empty Filter State -->
      <template x-if="filteredProducts.length === 0 && !loading">
        <div class="text-center py-20 bg-white rounded-xl border border-gray-100 shadow-sm">
          <p class="text-gray-500 text-lg">No products found matching your criteria.</p>
        </div>
      </template>
    </div>

    <!-- VIEW 2: CART & CHECKOUT PREPARATION -->
    <div x-show="view === 'cart'" class="max-w-3xl mx-auto space-y-6">
      <h2 class="text-2xl font-bold tracking-tight text-gray-900">Shopping Cart</h2>
      
      <template x-if="cart.length === 0">
        <div class="bg-white p-12 rounded-xl text-center border border-gray-100 shadow-sm space-y-4">
          <p class="text-gray-500 text-lg">Your cart is currently empty.</p>
          <button @click="view = 'shop'" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium text-sm hover:bg-indigo-700 transition">Start Shopping</button>
        </div>
      </template>

      <template x-if="cart.length > 0">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100">
          <template x-for="item in cart" :key="item.id">
            <div class="p-6 flex items-center justify-between gap-4">
              <div class="flex items-center space-x-4">
                <img :src="item.image_url" :alt="item.name" class="w-16 h-16 object-cover rounded-lg border border-gray-100">
                <div>
                  <h4 class="font-semibold text-gray-900" x-text="item.name"></h4>
                  <div class="text-indigo-600 font-medium text-sm" x-text="'$' + Number(item.price).toFixed(2)"></div>
                </div>
              </div>

              <div class="flex items-center space-x-3">
                <div class="flex items-center border border-gray-200 rounded-lg">
                  <button @click="updateQuantity(item.id, -1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-l-lg">-</button>
                  <span class="px-3 py-1 text-sm font-medium" x-text="item.quantity"></span>
                  <button @click="updateQuantity(item.id, 1)" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded-r-lg">+</button>
                </div>
                <button @click="removeFromCart(item.id)" class="text-red-500 hover:text-red-700 p-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            </div>
          </template>

          <!-- Cart Summary & Checkout Trigger -->
          <div class="p-6 bg-gray-50 rounded-b-xl space-y-4">
            <div class="flex justify-between items-center text-lg font-bold">
              <span>Subtotal:</span>
              <span class="text-indigo-600" x-text="'$' + cartSubtotal.toFixed(2)"></span>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">Email Address for Receipt & Order Tracking</label>
              <input type="email" x-model="email" placeholder="you@example.com" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white">
            </div>

            <button @click="handleCheckout" :disabled="loading"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold text-center transition shadow-sm disabled:opacity-50">
              <span x-show="!loading">Proceed to Secure Checkout</span>
              <span x-show="loading">Connecting to Stripe...</span>
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- VIEW 3: SUCCESS CONFIRMATION -->
    <div x-show="view === 'success'" class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center space-y-6">
      <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <div class="space-y-2">
        <h2 class="text-2xl font-bold text-gray-900">Payment Successful!</h2>
        <p class="text-gray-500 text-sm">Thank you for your purchase. Your order has been processed securely via Stripe.</p>
        <template x-if="orderSuccessData && orderSuccessData.sessionId">
          <p class="text-xs text-gray-400 font-mono mt-2">Session ID: <span x-text="orderSuccessData.sessionId"></span></p>
        </template>
      </div>
      <button @click="view = 'shop'" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium text-sm hover:bg-indigo-700 transition">Continue Shopping</button>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-500">
    <p>&copy; 2026 VeloceStore. Powered entirely by Supabase & Stripe (Serverless Vanilla JS).</p>
  </footer>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
